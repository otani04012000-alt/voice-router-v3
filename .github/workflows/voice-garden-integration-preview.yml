name: Voice garden integration preview
on:
  push:
    branches: [preview/translation-design]
    paths: [.github/workflows/voice-garden-integration-preview.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'otani04012000-alt/voice-router-v3' && github.ref == 'refs/heads/preview/translation-design'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/translation-design
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate real-state voice garden
        env:
          PATCH: 
        run: |
          python3 - <<'PY'
          import os,base64,zlib
          exec(compile(zlib.decompress(base64.b64decode(os.environ['PATCH'])), 'apply-garden.py', 'exec'))
          PY
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Commit validated illustration on preview only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/translator/voice-router-core.tsx components/translator/voice-garden.tsx
          git commit -m 'feat: integrate reactive shader and blue synapse voice garden'
          git push origin HEAD:refs/heads/preview/translation-design
