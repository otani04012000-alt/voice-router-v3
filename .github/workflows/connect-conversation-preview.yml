name: Connect conversation preview
on:
  push:
    branches: [preview/translation-design]
    paths: [.github/workflows/connect-conversation-preview.yml]
permissions:
  contents: write
concurrency:
  group: connect-conversation-preview
  cancel-in-progress: false
jobs:
  connect:
    if: github.repository == 'otani04012000-alt/voice-router-v3' && github.ref == 'refs/heads/preview/translation-design'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/translation-design
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed screen connection
        env:
          CONNECTION_SCRIPT_ZLIB: 
        run: |
          python3 - <<'PY'
          import os, base64, zlib
          exec(compile(zlib.decompress(base64.b64decode(os.environ['CONNECTION_SCRIPT_ZLIB'])), 'reviewed-screen-connection.py', 'exec'))
          PY
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Save validated connection to preview branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/translator/studio.tsx lib/conversation-confirmation.d.mts
          git commit -m 'feat: connect voice shortcuts and live transcript to studio'
          git push origin HEAD:refs/heads/preview/translation-design
