name: Voice garden fixed preview
on:
  push:
    branches: [preview/translation-design]
    paths: [.github/workflows/voice-garden-fixed-preview.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'otani04012000-alt/voice-router-v3' && github.ref == 'refs/heads/preview/translation-design'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/translation-design
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed integration and repair shader tokens
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,hashlib,base64,zlib,json
          p=Path('.github/workflows/voice-garden-integration-preview.yml')
          b=p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()=='17308e506cb53680192b532c8ce3939bf5b50f78','Recipe changed'
          payload=re.search(r'^          PATCH: ([A-Za-z0-9+/=]+)$',b.decode(),re.M).group(1)
          exec(compile(zlib.decompress(base64.b64decode(payload)),'apply-garden.py','exec'))
          p=Path('components/translator/voice-garden.tsx')
          s=p.read_text()
          for key,token in [('VS','VERTEX_SHADER'),('FS','FRAGMENT_SHADER')]:
              literal=re.search(r'^const '+key+r'=(.+);$',s,re.M).group(1)
              assert isinstance(json.loads(literal),str)
              broken='gl.'+literal+'_SHADER'
              assert s.count(broken)==1,'Unexpected shader token count'
              s=s.replace(broken,'gl.'+token,1)
          assert 'compile(gl.VERTEX_SHADER,VS)' in s
          assert 'compile(gl.FRAGMENT_SHADER,FS)' in s
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Commit validated illustration on preview only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/translator/voice-router-core.tsx components/translator/voice-garden.tsx
          git commit -m 'feat: integrate corrected reactive shader and blue synapses'
          git push origin HEAD:refs/heads/preview/translation-design
