<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notebook Bridge</title><style>body{width:330px;margin:0;padding:18px;background:#faf8f3;color:#1a1a18;font:14px system-ui}h1{font-size:18px;margin:0 0 8px}p{line-height:1.6;color:#635f58}label{display:block;font-size:12px;margin:12px 0 4px}input{width:100%;box-sizing:border-box;padding:8px;border:1px solid #cfc7b9;background:#fff}button{width:100%;margin-top:12px;padding:10px;border:0;background:#31546a;color:#fff;font-weight:700;cursor:pointer}button.alt{background:#8a6a12}#status{white-space:pre-wrap;font-size:12px;margin-top:10px;color:#635f58}</style><body><h1>Notebook Bridge</h1><p>開いているGemini Notebookの表示内容を、MarkdownとしてあなたのGitHubへ保存します。</p><label>GitHubトークン（端末内だけに保存）</label><input id="token" type="password" placeholder="github_pat_..." autocomplete="off"><label>保存先リポジトリ</label><input id="repo" value="otani04012000-alt/voice-router-v3"><label>保存先パス</label><input id="path" value="knowledge/notebook/latest.md"><button id="sync">今のNotebookを保存</button><button id="download" class="alt">Markdownをダウンロード</button><div id="status"></div><script src="popup.js"></script></body></html>
