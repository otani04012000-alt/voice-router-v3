<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
<title id="title">A案 黒いインクの翻訳職人</title><desc id="desc">待機中は椅子で足を揺らし、翻訳中は教科書をめくってメモを取り、完了すると葉巻とスマホでくつろぐ、正体不明のドットキャラクター。</desc>
<style>
text{font-family:monospace;fill:#dbdfd4;font-size:15px}.kick{transform-box:fill-box;transform-origin:top center;animation:kick .65s steps(4,end) infinite}.opposite{animation-delay:-.325s}.page{transform-box:fill-box;transform-origin:left bottom;animation:page .7s steps(5,end) infinite}.write{animation:write .22s steps(2,end) infinite}.smoke{animation:smoke 2s steps(7,end) infinite}.late{animation-delay:-1s}.tap{animation:tap .7s steps(3,end) infinite}.sweat{animation:sweat .9s steps(4,end) infinite}
@keyframes kick{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(24deg)}}@keyframes page{0%{transform:scaleX(1)}50%{transform:scaleX(.1)}100%{transform:scaleX(1)}}@keyframes write{0%,100%{transform:translate(0,0)}50%{transform:translate(5px,-2px)}}@keyframes smoke{0%{opacity:0;transform:translate(0,6px)}25%{opacity:.65}100%{opacity:0;transform:translate(-9px,-25px)}}@keyframes tap{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes sweat{0%{opacity:0;transform:translateY(0)}50%{opacity:1}100%{opacity:0;transform:translateY(8px)}}
@media(prefers-reduced-motion:reduce){.kick,.page,.write,.smoke,.tap,.sweat{animation:none}}
</style>
